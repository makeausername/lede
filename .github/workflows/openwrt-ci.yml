name: HKC N60 Pro Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - codex/minimal-ssr-n60
    paths:
      - ".github/workflows/openwrt-ci.yml"
      - "configs/hkc-n60-pro.config"
      - "custom/**"
      - "target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts"

permissions:
  contents: read

concurrency:
  group: hkc-n60-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build minimal production candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
      PACKAGES_REV: b4be6c8c8459bd3ce0096a1791a893c4df35b7e5
      LUCI_REV: 349a4823afd41512fb7f1310966790ccaab8f8b8
      ROUTING_REV: 56d7a818b71b83b0051b85d38efa3b3b558adf75
      TELEPHONY_REV: a04b7acfd30a6f8f4d78e62955376c4febcb0976
      HELLOWORLD_REV: 737e5d719030363dbf96224c9f065afa5ea6dba8

    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar file flex g++-multilib gawk \
            gcc-multilib genisoimage gettext git gperf \
            haveged help2man intltool libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libc6-dev-i386 libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo time uglifyjs unzip \
            upx-ucl wget xmlto xxd zlib1g-dev
          sudo apt-get clean

      - name: Fetch and pin package feeds
        shell: bash
        run: |
          set -euo pipefail
          cp custom/feeds.conf.hkc feeds.conf
          ./scripts/feeds update -a

          pin_feed() {
            local name="$1"
            local revision="$2"
            if ! git -C "feeds/${name}" cat-file -e "${revision}^{commit}" 2>/dev/null; then
              git -C "feeds/${name}" fetch --depth=1 origin "$revision"
            fi
            git -C "feeds/${name}" checkout --detach "$revision"
            test "$(git -C "feeds/${name}" rev-parse HEAD)" = "$revision"
          }

          pin_feed packages "$PACKAGES_REV"
          pin_feed luci "$LUCI_REV"
          pin_feed routing "$ROUTING_REV"
          pin_feed telephony "$TELEPHONY_REV"
          pin_feed helloworld "$HELLOWORLD_REV"
          ./scripts/feeds update -a -i

      - name: Apply only the three requested customizations
        shell: bash
        run: |
          set -euo pipefail
          ssr_root='feeds/helloworld/luci-app-ssr-plus'
          sha256sum \
            "$ssr_root/root/etc/init.d/shadowsocksr" \
            "$ssr_root/root/usr/bin/ssr-monitor" \
            "$ssr_root/root/usr/share/shadowsocksr/gen_config.lua" \
            "$ssr_root/root/usr/share/shadowsocksr/subscribe.lua" \
            > /tmp/upstream-ssr-runtime.sha256

          git -C feeds/helloworld apply --check \
            ../../custom/patches/helloworld/110-force-blacklist-udp.patch
          git -C feeds/helloworld apply \
            ../../custom/patches/helloworld/110-force-blacklist-udp.patch
          sha256sum --check --strict /tmp/upstream-ssr-runtime.sha256
          grep -Fq 'forced proxy domains must win before the China-IP bypass' \
            "$ssr_root/root/usr/bin/ssr-rules"

          git -C feeds/luci apply --check \
            ../../custom/patches/luci/130-hide-argon-version-footer.patch
          git -C feeds/luci apply \
            ../../custom/patches/luci/130-hide-argon-version-footer.patch
          for footer in \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/footer.ut \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/footer_login.ut; do
            ! grep -Fq '<footer' "$footer"
            ! grep -Fq 'Powered by {{ version.luciname }}' "$footer"
            ! grep -Fq 'ArgonTheme' "$footer"
          done

          ./scripts/feeds install -a

      - name: Inject SSIDs and forced proxy domains
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$WIFI_PASSWORD" =~ ^[A-Za-z0-9]{8,63}$ ]]; then
            echo "::error::WIFI_PASSWORD must be 8-63 ASCII letters or digits"
            exit 1
          fi

          install -d files/etc/uci-defaults files/usr/share/hkc
          install -m 0755 custom/hkc-defaults.sh.in \
            files/etc/uci-defaults/zz-hkc-minimal-defaults
          install -m 0644 custom/forced-proxy-domains.list \
            files/usr/share/hkc/forced-proxy-domains.list
          sed -i "s/__WIFI_PASSWORD__/${WIFI_PASSWORD}/g" \
            files/etc/uci-defaults/zz-hkc-minimal-defaults

          defaults='files/etc/uci-defaults/zz-hkc-minimal-defaults'
          sh -n "$defaults"
          ! grep -Fq '__WIFI_PASSWORD__' "$defaults"
          grep -Fq "ssid='HKC'" "$defaults"
          grep -Fq "ssid='HKC-5G'" "$defaults"
          grep -Fq 'wireless.${iface}.key=${WIFI_PASSWORD}' "$defaults"
          grep -Fq "blacklist='/etc/ssrplus/black.list'" "$defaults"
          ! grep -Eq 'network\.|firewall\.|upnpd\.|crontab|/sbin/reboot|shadowsocksr\.@global|server_subscribe' "$defaults"

          for domain in openai.com chatgpt.com anthropic.com claude.ai; do
            grep -Fqx "$domain" files/usr/share/hkc/forced-proxy-domains.list
          done
          if grep -Ev '^(#.*|[a-z0-9.-]+|)$' files/usr/share/hkc/forced-proxy-domains.list; then
            echo "::error::Forced-proxy list contains an invalid line"
            exit 1
          fi

      - name: Generate and validate build configuration
        shell: bash
        run: |
          set -euo pipefail
          cp configs/hkc-n60-pro.config .config
          make defconfig

          require_config() {
            grep -Fqx "$1" .config || {
              echo "::error::Required config missing: $1"
              exit 1
            }
          }
          reject_config() {
            if grep -Fqx "$1" .config; then
              echo "::error::Forbidden config selected: $1"
              exit 1
            fi
          }

          require_config 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_Iptables_Transparent_Proxy=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ChinaDNS_NG=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Mihomo=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadow_TLS=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Client=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Simple_Obfs=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_V2ray_Plugin=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Client=y'
          require_config 'CONFIG_PACKAGE_luci-theme-argon=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=y'
          require_config 'CONFIG_PACKAGE_wpad-openssl=y'
          reject_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Http_Proxy=y'
          reject_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Kcptun=y'
          reject_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server=y'
          reject_config 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Server=y'
          reject_config 'CONFIG_PACKAGE_luci-app-upnp=y'
          reject_config 'CONFIG_PACKAGE_kmod-tcp-bbr=y'

          ./scripts/diffconfig.sh | tee hkc-n60-pro.diffconfig

      - name: Download source packages
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout --signal=TERM --kill-after=30s 25m make download -j8; then
            echo "::warning::Parallel download failed; retrying serially"
            find dl -type f -size -1024c -print -delete
            timeout --signal=TERM --kill-after=30s 25m make download -j1 V=s
          fi
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify firmware scope and package manifest
        shell: bash
        run: |
          set -euo pipefail
          target_dir='bin/targets/mediatek/filogic'
          firmware="$(find "$target_dir" -maxdepth 1 -type f \
            -name '*netcore_n60-pro*sysupgrade.bin' -print -quit)"
          manifest="$(find "$target_dir" -maxdepth 1 -type f \
            -name '*netcore_n60-pro*.manifest' -print -quit)"
          test -n "$firmware"
          test -n "$manifest"

          for package in \
            xray-core mihomo naiveproxy shadow-tls shadowsocks-rust-sslocal \
            simple-obfs-client v2ray-plugin shadowsocksr-libev-ssr-local \
            shadowsocksr-libev-ssr-redir chinadns-ng luci-app-ssr-plus \
            luci-i18n-ssr-plus-zh-cn luci-theme-argon; do
            grep -Eq "^${package} " "$manifest" || {
              echo "::error::Required package missing from manifest: ${package}"
              exit 1
            }
          done
          ! grep -Eq '^(3proxy|kcptun-client|shadowsocks-rust-ssserver|shadowsocksr-libev-ssr-server) ' "$manifest"

          inspect_dir="$(mktemp -d)"
          trap 'sudo rm -rf "$inspect_dir"' EXIT
          tar -xf "$firmware" -C "$inspect_dir"
          root_image="$(find "$inspect_dir" -type f -name root -print -quit)"
          test -n "$root_image"

          defaults="$inspect_dir/defaults"
          domains="$inspect_dir/domains"
          ssr_init="$inspect_dir/ssr-init"
          ssr_monitor="$inspect_dir/ssr-monitor"
          ssr_generator="$inspect_dir/gen-config.lua"
          ssr_rules="$inspect_dir/ssr-rules"
          argon_footer="$inspect_dir/argon-footer.ut"
          unsquashfs -cat "$root_image" etc/uci-defaults/zz-hkc-minimal-defaults >"$defaults"
          unsquashfs -cat "$root_image" usr/share/hkc/forced-proxy-domains.list >"$domains"
          unsquashfs -cat "$root_image" etc/init.d/shadowsocksr >"$ssr_init"
          unsquashfs -cat "$root_image" usr/bin/ssr-monitor >"$ssr_monitor"
          unsquashfs -cat "$root_image" usr/share/shadowsocksr/gen_config.lua >"$ssr_generator"
          unsquashfs -cat "$root_image" usr/bin/ssr-rules >"$ssr_rules"
          unsquashfs -cat "$root_image" usr/share/ucode/luci/template/themes/argon/footer.ut >"$argon_footer"

          grep -Fq "ssid='HKC'" "$defaults"
          grep -Fq "ssid='HKC-5G'" "$defaults"
          grep -Fqx 'openai.com' "$domains"
          grep -Fqx 'chatgpt.com' "$domains"
          ! grep -Eq 'network\.|firewall\.|upnpd\.|/sbin/reboot|shadowsocksr\.@global|server_subscribe' "$defaults"
          cmp "$ssr_init" feeds/helloworld/luci-app-ssr-plus/root/etc/init.d/shadowsocksr
          cmp "$ssr_monitor" feeds/helloworld/luci-app-ssr-plus/root/usr/bin/ssr-monitor
          cmp "$ssr_generator" feeds/helloworld/luci-app-ssr-plus/root/usr/share/shadowsocksr/gen_config.lua
          grep -Fq 'forced proxy domains must win before the China-IP bypass' "$ssr_rules"
          ! grep -Fq '<footer' "$argon_footer"
          ! grep -Fq 'Powered by' "$argon_footer"

          sha256sum "$firmware" | tee "$target_dir/HKC-N60-PRO-SHA256SUMS"

      - name: Prepare release candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          target_dir='bin/targets/mediatek/filogic'
          find "$target_dir" -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*' \
               -o -name 'HKC-N60-PRO-SHA256SUMS' \
               -o -name 'profiles.json' \
               -o -name 'sha256sums' \) \
            -exec cp -v {} artifact/ \;
          cp -v hkc-n60-pro.diffconfig artifact/
          test -n "$(find artifact -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)"

      - name: Upload HKC N60 Pro firmware
        uses: actions/upload-artifact@v4
        with:
          name: HKC-N60-PRO-${{ github.run_number }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
