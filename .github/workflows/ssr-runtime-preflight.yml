name: SSR ARM64 Runtime Preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  runtime-preflight:
    name: Validate patched SSR on ARM64 firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HELLOWORLD_REV: 737e5d719030363dbf96224c9f065afa5ea6dba8

    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4

      - name: Download known-good N60 Pro runtime base
        uses: actions/download-artifact@v4
        with:
          name: HKC-N60-PRO-17-e1b00ab6ebb045541ed2471335b95d621ad4a9e4
          path: preflight-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30635058776

      - name: Install runtime validation dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qemu-user-static squashfs-tools

      - name: Prepare current patched SSR source
        shell: bash
        run: |
          set -euo pipefail
          git init .preflight-helloworld
          git -C .preflight-helloworld remote add origin \
            https://github.com/fw876/helloworld.git
          git -C .preflight-helloworld fetch --depth=1 origin "$HELLOWORLD_REV"
          git -C .preflight-helloworld checkout --detach FETCH_HEAD
          for patch in custom/patches/helloworld/*.patch; do
            git -C .preflight-helloworld apply --check --unidiff-zero \
              "$GITHUB_WORKSPACE/$patch"
            git -C .preflight-helloworld apply --unidiff-zero \
              "$GITHUB_WORKSPACE/$patch"
          done
          sh custom/tests/test-ssr-production.sh \
            .preflight-helloworld/luci-app-ssr-plus

      - name: Validate current SSR on extracted ARM64 firmware
        shell: bash
        run: |
          set -euo pipefail
          firmware="$(find preflight-artifact -maxdepth 1 -type f \
            -name '*netcore_n60-pro*sysupgrade.bin' -print -quit)"
          test -n "$firmware"

          inspect_dir="$(mktemp -d)"
          trap 'sudo rm -rf "$inspect_dir"' EXIT
          tar -xf "$firmware" -C "$inspect_dir"
          root_image="$(find "$inspect_dir" -type f -name root -print -quit)"
          test -n "$root_image"

          runtime_root="$inspect_dir/runtime-root"
          sudo unsquashfs -d "$runtime_root" "$root_image" >/dev/null
          sudo install -m 0755 /usr/bin/qemu-aarch64-static \
            "$runtime_root/usr/bin/qemu-aarch64-static"

          ssr_source='.preflight-helloworld/luci-app-ssr-plus'
          sudo install -D -m 0644 \
            "$ssr_source/luasrc/model/shadowsocksr/subscription_storage.lua" \
            "$runtime_root/usr/lib/lua/luci/model/shadowsocksr/subscription_storage.lua"
          sudo install -D -m 0644 \
            "$ssr_source/luasrc/model/shadowsocksr/subscription_runtime.lua" \
            "$runtime_root/usr/lib/lua/luci/model/shadowsocksr/subscription_runtime.lua"
          sudo install -D -m 0755 \
            "$ssr_source/root/usr/share/shadowsocksr/gen_config.lua" \
            "$runtime_root/usr/share/shadowsocksr/gen_config.lua"
          sudo install -D -m 0755 \
            "$ssr_source/root/usr/share/shadowsocksr/subscribe.lua" \
            "$runtime_root/usr/share/shadowsocksr/subscribe.lua"

          sudo install -m 0644 custom/tests/offline-luci-model-uci.lua \
            "$runtime_root/tmp/offline-luci-model-uci.lua"
          sudo install -m 0644 custom/tests/test-subscription-storage.lua \
            "$runtime_root/tmp/test-subscription-storage.lua"
          sudo install -m 0644 custom/tests/test-subscription-runtime.lua \
            "$runtime_root/tmp/test-subscription-runtime.lua"
          sudo install -m 0644 custom/tests/test-subscription-runtime-target.lua \
            "$runtime_root/tmp/test-subscription-runtime-target.lua"
          # Mirror the package's first-boot install step. The raw SquashFS
          # contains an empty /etc/config file until this template is copied.
          sudo install -m 0600 \
            "$runtime_root/usr/share/shadowsocksr/shadowsocksr.config" \
            "$runtime_root/etc/config/shadowsocksr"

          target_lua() {
            sudo chroot "$runtime_root" /usr/bin/qemu-aarch64-static \
              /usr/bin/lua "$@"
          }
          target_uci() {
            sudo chroot "$runtime_root" /usr/bin/qemu-aarch64-static \
              /sbin/uci "$@"
          }
          target_xray() {
            # Go 1.26 ARM64 binaries can trip a QEMU user-mode concurrency
            # bug while initializing encoding/json. A real router is not
            # emulated; serialize only this offline target validation.
            sudo env GOMAXPROCS=1 GODEBUG=asyncpreemptoff=1 \
              chroot "$runtime_root" \
              /usr/bin/qemu-aarch64-static \
              /usr/bin/xray "$@"
          }

          target_lua -e '
            local fs = require("nixio.fs")
            local path = "/tmp/hkc-nixio-chmod-test"
            assert(fs.writefile(path, "ok"))
            assert(fs.chmod(path, 600))
            assert(fs.unlink(path))
          '
          target_lua /tmp/test-subscription-storage.lua
          target_lua /tmp/test-subscription-runtime.lua
          target_lua /tmp/test-subscription-runtime-target.lua

          target_uci -q set shadowsocksr.hkc_runtime_vless=servers
          target_uci -q set shadowsocksr.hkc_runtime_vless.type='v2ray'
          target_uci -q set shadowsocksr.hkc_runtime_vless.v2ray_protocol='vless'
          target_uci -q set shadowsocksr.hkc_runtime_vless.server='192.0.2.1'
          target_uci -q set shadowsocksr.hkc_runtime_vless.server_port='443'
          target_uci -q set shadowsocksr.hkc_runtime_vless.vmess_id='00000000-0000-4000-8000-000000000001'
          target_uci -q set shadowsocksr.hkc_runtime_vless.transport='raw'
          target_uci -q set shadowsocksr.hkc_runtime_vless.reality='1'
          target_uci -q set shadowsocksr.hkc_runtime_vless.reality_publickey='B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw'
          target_uci -q set shadowsocksr.hkc_runtime_vless.reality_shortid='0123456789abcdef'
          target_uci -q set shadowsocksr.hkc_runtime_vless.tls_host='example.com'
          target_uci -q set shadowsocksr.hkc_runtime_vless.tls_flow='xtls-rprx-vision'
          target_uci -q set shadowsocksr.hkc_runtime_vless.fingerprint='chrome'
          target_uci -q set shadowsocksr.@global[0].global_server='hkc_runtime_vless'
          target_uci -q commit shadowsocksr

          target_lua \
            -e 'package.loaded["luci.model.uci"] = dofile("/tmp/offline-luci-model-uci.lua")' \
            /usr/share/shadowsocksr/gen_config.lua hkc_runtime_vless tcp 38123 \
            >"$inspect_dir/xray-vless-tcp.json"
          target_lua \
            -e 'package.loaded["luci.model.uci"] = dofile("/tmp/offline-luci-model-uci.lua")' \
            /usr/share/shadowsocksr/gen_config.lua hkc_runtime_vless udp 38124 \
            >"$inspect_dir/xray-vless-udp.json"
          grep -Fq '"followRedirect": true' "$inspect_dir/xray-vless-tcp.json"
          grep -Fq '"tproxy": "tproxy"' "$inspect_dir/xray-vless-udp.json"

          sudo install -m 0600 "$inspect_dir/xray-vless-tcp.json" \
            "$runtime_root/tmp/xray-vless-tcp.json"
          sudo install -m 0600 "$inspect_dir/xray-vless-udp.json" \
            "$runtime_root/tmp/xray-vless-udp.json"
          target_xray run -test -c /tmp/xray-vless-tcp.json
          target_xray run -test -c /tmp/xray-vless-udp.json

          target_xray run -c /tmp/xray-vless-tcp.json \
            >"$inspect_dir/xray-runtime.log" 2>&1 &
          xray_pid=$!
          listener_ready=0
          for _ in $(seq 1 20); do
            if ss -lnt | grep -Eq '[:.]38123[[:space:]]'; then
              listener_ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$listener_ready" -ne 1 ]; then
            cat "$inspect_dir/xray-runtime.log"
            sudo kill "$xray_pid" 2>/dev/null || true
            wait "$xray_pid" 2>/dev/null || true
            exit 1
          fi
          sudo kill "$xray_pid" 2>/dev/null || true
          wait "$xray_pid" 2>/dev/null || true
          echo 'ARM64 SSR runtime preflight passed'
