name: Temporary HKC LuCI Preview

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preview:
    name: Render exact firmware LuCI
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout preview harness
        uses: actions/checkout@v4

      - name: Download successful firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: HKC-N60-PRO-6-37f9f11649dc021fad37c9df7356a03550c83872
          path: firmware
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30261598148

      - name: Install ARM64 and browser preview dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qemu-user-static squashfs-tools
          npm install --no-save playwright-core@1.55.0
          command -v google-chrome >/dev/null
          command -v qemu-aarch64-static >/dev/null

      - name: Extract firmware and seed hardware-independent preview state
        shell: bash
        run: |
          set -euo pipefail
          firmware="$(find firmware -maxdepth 1 -type f \
            -name '*netcore_n60-pro*sysupgrade.bin' -print -quit)"
          test -n "$firmware"

          mkdir -p preview-work preview-logs preview-screenshots
          tar -xf "$firmware" -C preview-work
          root_image="$(find preview-work -type f -name root -print -quit)"
          test -n "$root_image"
          sudo unsquashfs -d preview-root "$root_image" >/dev/null

          # The preview never runs first-boot defaults because they contain the
          # private Wi-Fi credential. Seed equivalent non-secret UI state below.
          sudo rm -f preview-root/etc/uci-defaults/zz-hkc-defaults-v2
          sudo cp /usr/bin/qemu-aarch64-static preview-root/usr/bin/
          test -x preview-root/www/cgi-bin/luci
          # uhttpd's CGI dispatcher requires the world-executable bit. The
          # squashfs metadata is safe for the router but can be narrowed by
          # artifact extraction under the hosted runner, so normalize only
          # this temporary preview copy.
          sudo chmod 0755 preview-root/www/cgi-bin/luci
          sudo mkdir -p preview-root/{proc,sys,dev,var/run/ubus,tmp}
          sudo chmod 1777 preview-root/tmp
          sudo mount --bind /dev preview-root/dev
          sudo mount -t proc proc preview-root/proc
          sudo mount -t sysfs sys preview-root/sys

          for config in system network wireless luci upnpd shadowsocksr; do
            sudo touch "preview-root/etc/config/${config}"
          done
          sudo truncate -s 0 preview-root/etc/config/system
          sudo truncate -s 0 preview-root/etc/config/network
          sudo truncate -s 0 preview-root/etc/config/wireless
          sudo truncate -s 0 preview-root/etc/config/shadowsocksr

          sudo chroot preview-root /usr/bin/qemu-aarch64-static /sbin/uci -q batch <<'EOF'
          set system.system='system'
          set system.system.hostname='HKC'
          set system.system.zonename='Asia/Shanghai'
          set system.system.timezone='CST-8'

          set network.loopback='interface'
          set network.loopback.device='lo'
          set network.loopback.proto='static'
          set network.loopback.ipaddr='127.0.0.1'
          set network.loopback.netmask='255.0.0.0'
          set network.globals='globals'
          set network.lan='interface'
          set network.lan.device='br-lan'
          set network.lan.proto='static'
          set network.lan.ipaddr='192.168.8.1'
          set network.lan.netmask='255.255.255.0'
          set network.wan='interface'
          set network.wan.device='eth1'
          set network.wan.proto='dhcp'

          set wireless.radio0='wifi-device'
          set wireless.radio0.type='mac80211'
          set wireless.radio0.band='2g'
          set wireless.radio0.channel='auto'
          set wireless.radio0.htmode='HE20'
          set wireless.radio0.country='CN'
          set wireless.radio0.disabled='0'
          set wireless.default_radio0='wifi-iface'
          set wireless.default_radio0.device='radio0'
          set wireless.default_radio0.network='lan'
          set wireless.default_radio0.mode='ap'
          set wireless.default_radio0.ssid='HKC'
          set wireless.default_radio0.encryption='sae-mixed'
          set wireless.default_radio0.key='PREVIEW-ONLY'
          set wireless.default_radio0.ieee80211w='1'
          set wireless.default_radio0.disabled='0'

          set wireless.radio1='wifi-device'
          set wireless.radio1.type='mac80211'
          set wireless.radio1.band='5g'
          set wireless.radio1.channel='auto'
          set wireless.radio1.htmode='HE80'
          set wireless.radio1.country='CN'
          set wireless.radio1.disabled='0'
          set wireless.default_radio1='wifi-iface'
          set wireless.default_radio1.device='radio1'
          set wireless.default_radio1.network='lan'
          set wireless.default_radio1.mode='ap'
          set wireless.default_radio1.ssid='HKC-5G'
          set wireless.default_radio1.encryption='sae-mixed'
          set wireless.default_radio1.key='PREVIEW-ONLY'
          set wireless.default_radio1.ieee80211w='1'
          set wireless.default_radio1.disabled='0'

          set luci.main='core'
          set luci.main.lang='auto'
          set luci.main.mediaurlbase='/luci-static/argon'

          set upnpd.config='upnpd'
          set upnpd.config.enabled='1'
          set upnpd.config.enable_natpmp='1'
          set upnpd.config.enable_upnp='1'
          set upnpd.config.secure_mode='1'
          set upnpd.config.internal_iface='lan'

          set shadowsocksr.global='global'
          set shadowsocksr.global.global_server='nil'
          set shadowsocksr.global.run_mode='router'
          set shadowsocksr.global.dports='1'
          set shadowsocksr.global.pdnsd_enable='6'
          set shadowsocksr.global.filter_aaaa='1'
          set shadowsocksr.global.chinadns_ng_proto='tcp'
          set shadowsocksr.access_control='access_control'
          set shadowsocksr.access_control.router_proxy='1'
          set shadowsocksr.server_subscribe='server_subscribe'
          set shadowsocksr.server_subscribe.auto_update='1'
          set shadowsocksr.server_subscribe.auto_update_week_time='*'
          set shadowsocksr.server_subscribe.auto_update_day_time='5'
          set shadowsocksr.server_subscribe.auto_update_min_time='0'
          set shadowsocksr.server_subscribe.proxy='0'
          set shadowsocksr.server_subscribe.switch='1'
          commit
          EOF

          preview_hash="$(openssl passwd -1 -salt hkcpreview preview)"
          sudo sed -i "s#^root:[^:]*:#root:${preview_hash}:#" preview-root/etc/shadow

      - name: Start exact ARM64 LuCI userspace and capture pages
        shell: bash
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:8080
          PREVIEW_USERNAME: root
          PREVIEW_PASSWORD: preview
          PREVIEW_OUTPUT_DIR: preview-screenshots
        run: |
          set -euo pipefail

          cleanup() {
            set +e
            [ -z "${uhttpd_pid:-}" ] || sudo kill "$uhttpd_pid"
            [ -z "${rpcd_pid:-}" ] || sudo kill "$rpcd_pid"
            [ -z "${ubusd_pid:-}" ] || sudo kill "$ubusd_pid"
            sudo umount -l preview-root/proc
            sudo umount -l preview-root/sys
            sudo umount -l preview-root/dev
          }
          trap cleanup EXIT

          sudo chroot preview-root /usr/bin/qemu-aarch64-static \
            /sbin/ubusd -s /var/run/ubus/ubus.sock \
            >preview-logs/ubusd.log 2>&1 &
          ubusd_pid=$!

          for _ in $(seq 1 30); do
            [ -S preview-root/var/run/ubus/ubus.sock ] && break
            sleep 1
          done
          test -S preview-root/var/run/ubus/ubus.sock

          sudo chroot preview-root /usr/bin/qemu-aarch64-static \
            /sbin/rpcd -s /var/run/ubus/ubus.sock \
            >preview-logs/rpcd.log 2>&1 &
          rpcd_pid=$!

          sudo chroot preview-root /usr/bin/qemu-aarch64-static \
            /usr/sbin/uhttpd -f -h /www -r HKC -x /cgi-bin \
            -i luci=/usr/bin/lua \
            -p 127.0.0.1:8080 -t 60 -T 30 \
            >preview-logs/uhttpd.log 2>&1 &
          uhttpd_pid=$!

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/cgi-bin/luci/ >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/cgi-bin/luci/ >/dev/null; then
            cat preview-logs/uhttpd.log
            exit 1
          fi

          node .github/scripts/capture-luci-preview.mjs

      - name: Upload LuCI preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HKC-N60-PRO-LuCI-preview-${{ github.run_number }}
          path: |
            preview-screenshots/
            preview-logs/
          if-no-files-found: warn
          retention-days: 1
